name: NOVA Browser CI
on:
  push:
    paths:
      - "nova-browser/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "nova-browser/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nova-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nova-browser/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm test
