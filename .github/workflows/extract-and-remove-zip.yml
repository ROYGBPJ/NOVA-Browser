name: Extract NOVA Browser ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "nova-browser-stage1.zip"
      - ".github/workflows/extract-and-remove-zip.yml"

permissions:
  contents: write

concurrency:
  group: extract-nova-browser-zip
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project and remove archive
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import stat
          import zipfile

          archive = Path("nova-browser-stage1.zip")
          if not archive.is_file():
              raise SystemExit(
                  "nova-browser-stage1.zip was not found in the repository root."
              )

          root = Path.cwd().resolve()
          extracted = []
          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  name = info.filename
                  if not name or name.endswith("/"):
                      continue

                  member = PurePosixPath(name)
                  mode = info.external_attr >> 16
                  if (
                      member.is_absolute()
                      or ".." in member.parts
                      or "\\" in name
                      or (mode and stat.S_ISLNK(mode))
                  ):
                      raise SystemExit(f"Unsafe ZIP entry rejected: {name}")

                  target = (root / Path(*member.parts)).resolve()
                  if not target.is_relative_to(root):
                      raise SystemExit(f"ZIP entry escapes repository: {name}")

                  target.parent.mkdir(parents=True, exist_ok=True)
                  if target.exists():
                      if target.is_dir():
                          raise SystemExit(f"Cannot overwrite directory: {target}")
                      target.unlink()

                  with zf.open(info) as source, target.open("wb") as destination:
                      while chunk := source.read(1024 * 1024):
                          destination.write(chunk)

                  extracted.append(name)

          if not extracted:
              raise SystemExit("The ZIP contained no files to extract.")

          archive.unlink()
          print(f"Extracted {len(extracted)} files:")
          for name in extracted:
              print(f"  {name}")
          print("Removed nova-browser-stage1.zip.")

      - name: Commit extracted project files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
          else
            git commit -m "Extract NOVA Browser project and remove ZIP archive"
            git push
          fi
